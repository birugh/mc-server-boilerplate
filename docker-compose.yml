services:
  mc:
    image: itzg/minecraft-server:java25-jdk@sha256:f6c674167d6a62402950f8a28e25a46f4d69c223de18fa5b10d49341908f87aa
    container_name: meow-smp

    ports:
          - "25565:25565/tcp"
          - "19132:19132/udp"
    
    pull_policy: never
    tty: false
    stdin_open: false

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:exec,mode=1777

    env_file:
      - .env
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
    restart: unless-stopped

secrets:
  rcon_password:
    file: ./rcon_password.txt
