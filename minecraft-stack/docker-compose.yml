services:
  minecraft:
    # Last updated Sunday, September 6 2026
    image: itzg/minecraft-server:java25-jdk@sha256:f6c674167d6a62402950f8a28e25a46f4d69c223de18fa5b10d49341908f87aa

    networks:
      mc-monitoring:
        aliases:
          - minecraft
    ports:
      - "127.0.0.1:25565:25565/tcp"
      - "127.0.0.1:19132:19132/udp"

    user: "1000:1000"

    pull_policy: never
    read_only: true
    security_opt:
      - seccomp:unconfined
    
    tty: false
    stdin_open: false

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW

    deploy:
      resources:
        limits:
          memory: 4608M
          cpus: '2.5'
        reservations:
          memory: 1024M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    env_file:
      - .system.env
      - .mc.env
    secrets:
      - rcon_password
    tmpfs:
      - /tmp:exec,mode=1777
      - /run
    volumes:
      - ./data:/data
    restart: unless-stopped

    healthcheck:
      test: mc-health
      start_period: 2m
      interval: 30s
      timeout: 5s
      retries: 3


  playit:
    # Last updated Sunday, September 6 2026
    image: ghcr.io/playit-cloud/playit-agent:1.0.10@sha256:ca4766ced6e5bcee19137337808ec8fee5867c0910ac737efbb0bb452c378521

    network_mode: host

    pull_policy: never
    read_only: true
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

    env_file:
      - .playit.env
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /run:rw,noexec,nosuid,nodev,mode=755
    volumes:
      - ./playit_data:/etc/playit
    depends_on:
      minecraft:
        condition: service_healthy
    restart: unless-stopped

secrets:
  rcon_password:
    file: ./rcon_password.txt

networks:
  mc-monitoring:
    external: true
